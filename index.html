<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nebula Defender</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050817;color:#eaf7ff;font-family:system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:16px}
main{width:min(100%,1000px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}h1{font-size:clamp(20px,4vw,30px);letter-spacing:.14em;margin:0;color:#69eaff}header span{color:#9bb7d2;font-size:13px}#frame{position:relative;border:1px solid #24496d;border-radius:16px;overflow:hidden;box-shadow:0 0 55px #0a5a8c33;background:#050817}canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;touch-action:none}
#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;background:#030817bb}#overlay.hidden{display:none}#overlay h2{font-size:clamp(32px,7vw,64px);margin:0 0 8px;letter-spacing:.08em}#overlay p{color:#a9c9e5;margin:5px 0 20px}button{border:1px solid #67dfff;background:#123c61;color:white;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer}button:hover{background:#185b83}.help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#8daac4;font-size:13px;padding:10px 2px}.touch{display:none;justify-content:space-between;gap:10px;margin-top:10px}.touch button{min-width:76px;touch-action:none;user-select:none}.touch .fire{background:#62345f;border-color:#ff7bb7}
@media(max-width:650px){.touch{display:flex}.help{font-size:11px}}
</style></head>
<body><main><header><h1>✦ NEBULA DEFENDER</h1><span>ARCADE SPACE SURVIVAL</span></header>
<div id="frame"><canvas id="game" width="960" height="640" aria-label="Nebula Defender game"></canvas><div id="overlay"><h2>NEBULA<br>DEFENDER</h2><p>Defend the galaxy. Survive the waves. Defeat the boss.</p><button id="start">START GAME</button></div></div>
<div class="touch"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button><button class="fire" id="fire">FIRE ✦</button></div>
<div class="help"><span>Move: A/D or ← → &nbsp; · &nbsp; Shoot: SPACE</span><span>Pause: P &nbsp; · &nbsp; Start / restart: ENTER</span></div>
</main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),start=document.getElementById('start');
const W=960,H=640,keys={},touch={left:false,right:false,fire:false};let state='menu',last=0,time=0,score=0,best=Number(localStorage.getItem('nebulaBest')||0),lives=3,player,enemies=[],shots=[],foeShots=[],powers=[],particles=[],stars=[],boss=null,spawn=0,powerClock=9,shake=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
for(let i=0;i<130;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.7,2.3),v:rand(25,100)});
function reset(){score=0;lives=3;player={x:W/2,y:H-75,cool:0,rapid:0,shield:0,inv:0};enemies=[];shots=[];foeShots=[];powers=[];particles=[];boss=null;spawn=.5;powerClock=8;shake=0;state='playing';overlay.classList.add('hidden')}
function burst(x,y,color,n=18){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(50,240);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.8),max:.8,color})}shake=Math.max(shake,.15)}
function shoot(){if(player.cool>0)return;player.cool=player.rapid>0?.12:.26;shots.push({x:player.x-11,y:player.y-22,vy:-690},{x:player.x+11,y:player.y-22,vy:-690})}
function addEnemy(){let roll=Math.random(),type=roll<.58?'scout':roll<.88?'fighter':'tank';let spec={scout:[1.25,1,10,'#ff669e',17],fighter:[.82,2,20,'#ffae55',22],tank:[.48,5,35,'#bd8cff',27]}[type],diff=1+Math.min(1.8,score/260);enemies.push({x:rand(35,W-35),y:-35,speed:105*spec[0]*diff,hp:spec[1],max:spec[1],points:spec[2],color:spec[3],r:spec[4],phase:rand(0,7)})}
function startBoss(){boss={x:W/2,y:-90,hp:42,max:42,dir:1,fire:1,entered:false}}
function update(dt){time+=dt;stars.forEach(s=>{s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=rand(0,W)}});if(state!=='playing')return;
let dir=(keys.ArrowRight||keys.d||keys.D||touch.right?1:0)-(keys.ArrowLeft||keys.a||keys.A||touch.left?1:0);player.x=clamp(player.x+dir*440*dt,30,W-30);player.cool=Math.max(0,player.cool-dt);player.rapid=Math.max(0,player.rapid-dt);player.shield=Math.max(0,player.shield-dt);player.inv=Math.max(0,player.inv-dt);if(keys[' ']||touch.fire)shoot();
spawn-=dt;if(spawn<=0&&!boss){addEnemy();spawn=Math.max(.28,1.05/(1+Math.min(1.6,score/300)))*rand(.8,1.2)}if(score>=120&&!boss&&!window.bossDefeated){startBoss();window.bossDefeated=true}
powerClock-=dt;if(powerClock<=0){powers.push({x:rand(35,W-35),y:-20,type:['rapid','shield','health'][Math.floor(rand(0,3))]});powerClock=rand(13,19)}
enemies.forEach(e=>{e.y+=e.speed*dt;e.x+=Math.sin(time*1.8+e.phase)*28*dt});shots.forEach(b=>b.y+=b.vy*dt);foeShots.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});powers.forEach(p=>p.y+=125*dt);
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],hit=shots.findIndex(b=>Math.hypot(b.x-e.x,b.y-e.y)<e.r+5);if(hit>=0){shots.splice(hit,1);e.hp--;if(e.hp<=0){score+=e.points;burst(e.x,e.y,e.color);enemies.splice(i,1)}}else if(e.y>H+30||Math.hypot(e.x-player.x,e.y-player.y)<e.r+20){enemies.splice(i,1);hurt()}}
if(boss){if(!boss.entered){boss.y+=85*dt;if(boss.y>=115){boss.y=115;boss.entered=true}}else{boss.x+=boss.dir*75*dt;if(boss.x<115||boss.x>W-115)boss.dir*=-1;boss.fire-=dt;if(boss.fire<=0){boss.fire=1;[-55,0,55].forEach((vx,i)=>foeShots.push({x:boss.x+(i-1)*35,y:boss.y+35,vx,vy:270}))}}
for(let i=shots.length-1;i>=0;i--){let b=shots[i];if(Math.hypot(b.x-boss.x,b.y-boss.y)<88){shots.splice(i,1);boss.hp--;if(boss.hp<=0){score+=150;burst(boss.x,boss.y,'#ff5ba8',70);boss=null;window.bossDefeated=true;break}}}}
for(let i=foeShots.length-1;i>=0;i--){let b=foeShots[i];if(Math.hypot(b.x-player.x,b.y-player.y)<23){foeShots.splice(i,1);hurt()}}
for(let i=powers.length-1;i>=0;i--){let p=powers[i];if(Math.hypot(p.x-player.x,p.y-player.y)<30){if(p.type==='rapid')player.rapid=8;if(p.type==='shield')player.shield=7;if(p.type==='health')lives=Math.min(3,lives+1);powers.splice(i,1)}}
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt});particles=particles.filter(p=>p.life>0);shots=shots.filter(b=>b.y>-20);foeShots=foeShots.filter(b=>b.y<H+30&&b.x>-20&&b.x<W+20);powers=powers.filter(p=>p.y<H+20);if(lives<=0)endGame()}
function hurt(){if(player.inv>0||player.shield>0)return;lives--;player.inv=1.35;burst(player.x,player.y,'#5ce8ff',25)}
function endGame(){state='over';best=Math.max(best,score);localStorage.setItem('nebulaBest',best);overlay.classList.remove('hidden');overlay.querySelector('h2').innerHTML='SHIP LOST';overlay.querySelector('p').textContent='Final score: '+score+'  ·  Best: '+best;start.textContent='PLAY AGAIN'}
function poly(points,color,stroke='#fff'){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){ctx.fillStyle='#050817';ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle='rgba(120,190,255,'+(.35+Math.sin(time*2+s.x)*.2)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.save();if(shake>0){ctx.translate(rand(-4,4),rand(-4,4));shake=Math.max(0,shake-.012)}
if(state!=='menu'){powers.forEach(p=>{let color=p.type==='rapid'?'#5ce8ff':p.type==='shield'?'#6798ff':'#70ffae';glow(p.x,p.y,28,color);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,14,0,7);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(p.type==='health'?'+':p.type[0].toUpperCase(),p.x,p.y+7)});
shots.forEach(b=>{glow(b.x,b.y,15,'#4deaff');ctx.fillStyle='#b9faff';ctx.fillRect(b.x-2,b.y-9,4,18)});foeShots.forEach(b=>{glow(b.x,b.y,16,'#ff5599');ctx.fillStyle='#ff91bb';ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.fill()});
enemies.forEach(e=>{glow(e.x,e.y,e.r*2,e.color);poly([[e.x,e.y+e.r],[e.x-e.r,e.y-5],[e.x-e.r/2,e.y-e.r],[e.x,e.y-e.r/2],[e.x+e.r/2,e.y-e.r],[e.x+e.r,e.y-5]],e.color);if(e.max>1){ctx.fillStyle='#38233f';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle='#ffda75';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*e.hp/e.max,4)}});
if(boss){glow(boss.x,boss.y,100,'#ff4e9d');poly([[boss.x-90,boss.y-20],[boss.x-55,boss.y-52],[boss.x+55,boss.y-52],[boss.x+90,boss.y-20],[boss.x+70,boss.y+42],[boss.x,boss.y+58],[boss.x-70,boss.y+42]],'#8b326f','#ff70b8');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(boss.x,boss.y,16,0,7);ctx.fill();ctx.fillStyle='#32152e';ctx.fillRect(350,24,260,12);ctx.fillStyle='#ff5ba8';ctx.fillRect(350,24,260*boss.hp/boss.max,12)}
if(!(player.inv>0&&Math.floor(time*13)%2===0)){if(player.shield){ctx.strokeStyle='#6798ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,34,0,7);ctx.stroke()}glow(player.x,player.y,35,'#287dff');poly([[player.x,player.y-25],[player.x-25,player.y+20],[player.x-8,player.y+14],[player.x,player.y+20],[player.x+8,player.y+14],[player.x+25,player.y+20]],'#55bfff');ctx.fillStyle='#ffae55';ctx.beginPath();ctx.moveTo(player.x-8,player.y+17);ctx.lineTo(player.x,player.y+35+Math.sin(time*24)*5);ctx.lineTo(player.x+8,player.y+17);ctx.fill()}
particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;
ctx.fillStyle='#09152d';ctx.fillRect(0,0,W,48);ctx.font='bold 23px system-ui';ctx.fillStyle='#eaf7ff';ctx.textAlign='left';ctx.fillText('SCORE '+String(score).padStart(5,'0'),24,31);ctx.textAlign='center';ctx.font='18px system-ui';ctx.fillStyle='#a8cce8';ctx.fillText('BEST '+String(Math.max(best,score)).padStart(5,'0'),480,30);ctx.textAlign='right';ctx.fillStyle='#ff729e';ctx.font='bold 22px system-ui';ctx.fillText('♥ '.repeat(lives),936,31);if(player.rapid){ctx.textAlign='left';ctx.fillStyle='#5ce8ff';ctx.font='16px system-ui';ctx.fillText('RAPID '+player.rapid.toFixed(1)+'s',24,70)}}
ctx.restore()}
function loop(ts){let dt=Math.min((ts-last)/1000||0,.04);last=ts;update(dt);draw();requestAnimationFrame(loop)}
start.onclick=()=>{window.bossDefeated=false;reset();overlay.querySelector('h2').innerHTML='NEBULA<br>DEFENDER';overlay.querySelector('p').textContent='Defend the galaxy. Survive the waves. Defeat the boss.';start.textContent='START GAME'};
window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if((e.key==='Enter')&&(state==='menu'||state==='over'))start.click();if((e.key==='p'||e.key==='P')&&state==='playing'){state='paused';overlay.classList.remove('hidden');overlay.querySelector('h2').textContent='PAUSED';overlay.querySelector('p').textContent='Press P to resume';start.textContent='RESUME';start.onclick=()=>{state='playing';overlay.classList.add('hidden');start.onclick=()=>{window.bossDefeated=false;reset();overlay.classList.add('hidden')}}}else if((e.key==='p'||e.key==='P')&&state==='paused'){state='playing';overlay.classList.add('hidden')}});window.addEventListener('keyup',e=>keys[e.key]=false);
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();touch[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>touch[key]=false))}
bind('left','left');bind('right','right');bind('fire','fire');requestAnimationFrame(loop);
})();</script></body></html>
