<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Adventure</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101827;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(#72d9ff, #dff8ff);
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 5;
        }

        .info {
            background: rgba(20, 34, 56, 0.9);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .spacer {
            flex: 1;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 9px 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(20, 34, 56, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            z-index: 5;
            white-space: nowrap;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .panel {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            width: min(500px, 90%);
        }

        .panel h1 {
            font-size: 45px;
            margin-top: 0;
        }

        .panel button {
            background: #ffd43b;
            padding: 12px 22px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div id="game"><canvas id="canvas" width="960" height="540"><br></canvas>
        <div id="ui">
            <div class="info" id="score">⭐ 0</div>
            <div class="info" id="coins">🪙 0</div>
            <div class="info" id="lives">❤️ 3</div>
            <div class="info" id="level">Level 1</div>
            <div class="spacer"><br></div><button onclick="togglePause()">Pause</button> <button onclick="restartLevel()">Restart</button>
        </div>
        <div id="controls">1 = Move Left &nbsp; | &nbsp; 2 = Move Right &nbsp; | &nbsp; 3 = Jump &nbsp; | &nbsp; 4 = Restart</div>
        <div id="overlay">
            <div class="panel">
                <h1 id="overlayTitle">Game Over</h1>
                <p id="overlayText"><br></p><button onclick="startGame()">**** Again</button>
            </div>
        </div>
    </div>
    <script>
        "use strict";
        
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        
        const W = 960;
        const H = 540;
        
        let gameRunning = true;
        let paused = false;
        
        let currentLevel = 0;
        let score = 0;
        let coinsCollected = 0;
        let lives = 3;
        
        let worldWidth = 5000;
        
        let cameraX = 0;
        
        const player = {
          x: 120,
          y: 390,
          width: 38,
          height: 52,
          vx: 0,
          vy: 0,
          speed: 5,
          jumpPower: 12,
          gravity: 0.6,
          grounded: false,
          direction: 1,
          anim: 0,
          invincible: 0
        };
        
        const levels = [
          {
            name: "Sunny Meadow",
            width: 5000,
            goal: 4700
          },
          {
            name: "Golden Fields",
            width: 5800,
            goal: 5500
          },
          {
            name: "Rainbow Valley",
            width: 6600,
            goal: 6300
          }
        ];
        
        let coins = [];
        let powerups = [];
        
        function createLevel() {
        
          const level = levels[currentLevel];
        
          worldWidth = level.width;
        
          player.x = 120;
          player.y = 390;
          player.vx = 0;
          player.vy = 0;
        
          cameraX = 0;
        
          coins = [];
        
          powerups = [];
        
          for (let x = 300; x < level.goal; x += 180) {
        
            coins.push({
              x: x,
              y: 390,
              collected: false,
              bob: Math.random() * Math.PI * 2
            });
          }
        
          for (let x = 1000; x < level.goal; x += 1400) {
        
            powerups.push({
              x: x,
              y: 385,
              collected: false
            });
          }
        }
        
        function startGame() {
        
          currentLevel = 0;
          score = 0;
          coinsCollected = 0;
          lives = 3;
        
          gameRunning = true;
          paused = false;
        
          document.getElementById("overlay").style.display = "none";
        
          createLevel();
        
          updateUI();
        }
        
        function restartLevel() {
        
          lives = Math.max(1, lives);
        
          createLevel();
        
          paused = false;
        
          updateUI();
        }
        
        function togglePause() {
        
          if (!gameRunning) return;
        
          paused = !paused;
        }
        
        function gameOver() {
        
          gameRunning = false;
        
          document.getElementById("overlayTitle").textContent = "Game Over";
        
          document.getElementById("overlayText").innerHTML =
            "Score: <b>" + ***** + "</b><br>" +
            "Coins: <b>" + coinsCollected + "</b>";
        
          document.getElementById("overlay").style.display = "flex";
        }
        
        function victory() {
        
          gameRunning = false;
        
          document.getElementById("overlayTitle").textContent = "Victory! 🎉";
        
          document.getElementById("overlayText").innerHTML =
            "You completed all 3 levels!<br>" +
            "Final Score: <b>" + ***** + "</b><br>" +
            "Coins: <b>" + coinsCollected + "</b>";
        
          document.getElementById("overlay").style.display = "flex";
        }
        
        function nextLevel() {
        
          score += 500;
        
          currentLevel++;
        
          if (currentLevel >= levels.length) {
        
            victory();
            return;
          }
        
          createLevel();
        
          updateUI();
        }
        
        function updateUI() {
        
          document.getElementById("score").textContent =
            "⭐ " + score;
        
          document.getElementById("coins").textContent =
            "🪙 " + coinsCollected;
        
          document.getElementById("lives").textContent =
            "❤️ " + lives;
        
          document.getElementById("level").textContent =
            "Level " + (currentLevel + 1);
        }
        
        function jump() {
        
          if (player.grounded && gameRunning && !paused) {
        
            player.vy = -player.jumpPower;
        
            player.grounded = false;
          }
        }
        
        window.addEventListener("keydown", function(e) {
        
          if (e.key === "1") {
        
            player.vx = -player.speed;
            player.direction = -1;
          }
        
          if (e.key === "2") {
        
            player.vx = player.speed;
            player.direction = 1;
          }
        
          if (e.key === "3") {
        
            jump();
          }
        
          if (e.key === "4") {
        
            restartLevel();
          }
        
        });
        
        window.addEventListener("keyup", function(e) {
        
          if (e.key === "1" || e.key === "2") {
        
            player.vx = 0;
          }
        
        });
        
        canvas.addEventListener("click", function() {
        
          jump();
        
        });
        
        function update() {
        
          if (!gameRunning || paused) return;
        
          player.vy += player.gravity;
        
          player.x += player.vx;
          player.y += player.vy;
        
          player.anim += 0.15;
        
          /*
            FLAT GROUND
            No obstacles, no pits, no enemies.
          */
        
          const groundY = 455;
        
          if (player.y + player.height >= groundY) {
        
            player.y = groundY - player.height;
        
            player.vy = 0;
        
            player.grounded = true;
        
          } else {
        
            player.grounded = false;
          }
        
          if (player.x < 0) {
        
            player.x = 0;
          }
        
          if (player.x > worldWidth - player.width) {
        
            player.x = worldWidth - player.width;
          }
        
          cameraX = player.x - 350;
        
          if (cameraX < 0) {
        
            cameraX = 0;
          }
        
          if (cameraX > worldWidth - W) {
        
            cameraX = worldWidth - W;
          }
        
          /*
            COLLECT COINS
          */
        
          for (const coin of coins) {
        
            if (coin.collected) continue;
        
            const dx = player.x + player.width / 2 - coin.x;
        
            const dy = player.y + player.height / 2 - coin.y;
        
            const distance = Math.sqrt(dx * dx + dy * dy);
        
            if (distance < 40) {
        
              coin.collected = true;
        
              coinsCollected++;
        
              score += 25;
            }
          }
        
          /*
            POWERUPS
          */
        
          for (const power of powerups) {
        
            if (power.collected) continue;
        
            if (
              player.x < power.x + 28 &&
              player.x + player.width > power.x &&
              player.y < power.y + 28 &&
              player.y + player.height > power.y
            ) {
        
              power.collected = true;
        
              lives++;
        
              score += 100;
            }
          }
        
          /*
            FINISH
          */
        
          if (
            player.x + player.width >
            levels[currentLevel].goal
          ) {
        
            nextLevel();
          }
        
          updateUI();
        }
        
        function drawBackground() {
        
          /*
            Sky
          */
        
          const gradient = ctx.createLinearGradient(
            0, 0, 0, H
          );
        
          gradient.addColorStop(0, "#6ed7ff");
        
          gradient.addColorStop(1, "#e4fbff");
        
          ctx.fillStyle = gradient;
        
          ctx.fillRect(0, 0, W, H);
        
          /*
            Clouds
          */
        
          ctx.fillStyle = "rgba(255,255,255,0.8)";
        
          for (let i = 0; i < 10; i++) {
        
            const x =
              (i * 500 - cameraX * 0.2) % 5200;
        
            const y =
              60 + (i % 3) * 55;
        
            ctx.beginPath();
        
            ctx.arc(x, y, 25, 0, Math.PI * 2);
        
            ctx.arc(x + 35, y - 12, 30, 0, Math.PI * 2);
        
            ctx.arc(x + 70, y, 22, 0, Math.PI * 2);
        
            ctx.fill();
          }
        
          /*
            Hills
          */
        
          ctx.fillStyle = "#76bd68";
        
          for (let x = -500; x < worldWidth; x += 700) {
        
            const screenX = x - cameraX * 0.4;
        
            ctx.beginPath();
        
            ctx.moveTo(screenX, 455);
        
            ctx.quadraticCurveTo(
              screenX + 350,
              220,
              screenX + 700,
              455
            );
        
            ctx.fill();
          }
        
          /*
            Trees
          */
        
          for (let x = -200; x < worldWidth; x += 350) {
        
            const screenX = x - cameraX * 0.6;
        
            ctx.fillStyle = "#70452a";
        
            ctx.fillRect(
              screenX + 40,
              350,
              22,
              105
            );
        
            ctx.fillStyle = "#3e9b55";
        
            ctx.beginPath();
        
            ctx.arc(
              screenX + 50,
              330,
              55,
              0,
              Math.PI * 2
            );
        
            ctx.fill();
        
          }
        }
        
        function drawGround() {
        
          /*
            One giant flat platform
          */
        
          ctx.fillStyle = "#2e9b50";
        
          ctx.fillRect(
            -cameraX,
            455,
            worldWidth,
            85
          );
        
          /*
            Grass top
          */
        
          ctx.fillStyle = "#52ca69";
        
          ctx.fillRect(
            -cameraX,
            455,
            worldWidth,
            10
          );
        
          /*
            Small grass details
          */
        
          ctx.fillStyle = "#24733d";
        
          for (
            let x = Math.floor(cameraX / 40) * 40;
            x < cameraX + W;
            x += 40
          ) {
        
            ctx.fillRect(
              x - cameraX,
              470,
              3,
              10
            );
          }
        }
        
        function drawCoins() {
        
          for (const coin of coins) {
        
            if (coin.collected) continue;
        
            const x = coin.x - cameraX;
        
            const y =
              coin.y +
              Math.sin(
                performance.now() * 0.004 +
                coin.bob
              ) * 6;
        
            ctx.fillStyle = "#ffd22e";
        
            ctx.beginPath();
        
            ctx.arc(
              x,
              y,
              10,
              0,
              Math.PI * 2
            );
        
            ctx.fill();
        
            ctx.strokeStyle = "#fff3a8";
        
            ctx.lineWidth = 3;
        
            ctx.stroke();
        
          }
        }
        
        function drawPowerups() {
        
          for (const power of powerups) {
        
            if (power.collected) continue;
        
            const x = power.x - cameraX;
        
            ctx.fillStyle = "#ff5478";
        
            ctx.beginPath();
        
            ctx.arc(
              x + 14,
              power.y + 14,
              14,
              0,
              Math.PI * 2
            );
        
            ctx.fill();
        
            ctx.fillStyle = "white";
        
            ctx.font = "bold 18px Arial";
        
            ctx.textAlign = "center";
        
            ctx.fillText(
              "+",
              x + 14,
              power.y + 20
            );
          }
        }
        
        function drawGoal() {
        
          const goal =
            levels[currentLevel].goal;
        
          const x = goal - cameraX;
        
          ctx.strokeStyle = "#542e4f";
        
          ctx.lineWidth = 7;
        
          ctx.beginPath();
        
          ctx.moveTo(x, 455);
        
          ctx.lineTo(x, 320);
        
          ctx.stroke();
        
          ctx.fillStyle = "#ff5578";
        
          ctx.beginPath();
        
          ctx.moveTo(x, 325);
        
          ctx.lineTo(x + 75, 345);
        
          ctx.lineTo(x, 370);
        
          ctx.closePath();
        
          ctx.fill();
        
          ctx.fillStyle = "white";
        
          ctx.font = "bold 14px Arial";
        
          ctx.fillText(
            "GO!",
            x + 12,
            350
          );
        }
        
        function drawPlayer() {
        
          const x =
            player.x - cameraX;
        
          const y =
            player.y;
        
          ctx.save();
        
          ctx.translate(
            x + player.width / 2,
            y + player.height / 2
          );
        
          ctx.scale(
            player.direction,
            1
          );
        
          /*
            Shadow
          */
        
          ctx.fillStyle = "rgba(0,0,0,0.2)";
        
          ctx.beginPath();
        
          ctx.ellipse(
            0,
            28,
            20,
            6,
            0,
            0,
            Math.PI * 2
          );
        
          ctx.fill();
        
          /*
            Legs
          */
        
          ctx.fillStyle = "#253461";
        
          ctx.fillRect(
            -12,
            10,
            9,
            20
          );
        
          ctx.fillRect(
            3,
            10,
            9,
            20
          );
        
          /*
            Shoes
          */
        
          ctx.fillStyle = "#f0a13b";
        
          ctx.fillRect(
            -15,
            27,
            13,
            7
          );
        
          ctx.fillRect(
            3,
            27,
            13,
            7
          );
        
          /*
            Body
          */
        
          ctx.fillStyle = "#2e78d0";
        
          ctx.beginPath();
        
          ctx.roundRect(
            -16,
            -10,
            32,
            30,
            9
          );
        
          ctx.fill();
        
          /*
            Scarf
          */
        
          ctx.fillStyle = "#ff5c7c";
        
          ctx.fillRect(
            8,
            -5,
            19,
            6
          );
        
          /*
            Head
          */
        
          ctx.fillStyle = "#f6b579";
        
          ctx.beginPath();
        
          ctx.arc(
            0,
            -20,
            16,
            0,
            Math.PI * 2
          );
        
          ctx.fill();
        
          /*
            Hair
          */
        
          ctx.fillStyle = "#4d2f35";
        
          ctx.beginPath();
        
          ctx.arc(
            -2,
            -27,
            16,
            Math.PI,
            Math.PI * 2
          );
        
          ctx.fill();
        
          /*
            Eye
          */
        
          ctx.fillStyle = "#17243b";
        
          ctx.beginPath();
        
          ctx.arc(
            6,
            -21,
            2.5,
            0,
            Math.PI * 2
          );
        
          ctx.fill();
        
          /*
            Smile
          */
        
          ctx.strokeStyle = "#8d3d4b";
        
          ctx.lineWidth = 2;
        
          ctx.beginPath();
        
          ctx.arc(
            5,
            -17,
            5,
            0.1,
            1.2
          );
        
          ctx.stroke();
        
          /*
            Arms
          */
        
          ctx.fillStyle = "#f6b579";
        
          const swing =
            Math.sin(player.anim) * 3;
        
          ctx.fillRect(
            -23,
            -7 + swing,
            9,
            18
          );
        
          ctx.fillRect(
            14,
            -7 - swing,
            9,
            18
          );
        
          ctx.restore();
        }
        
        function draw() {
        
          drawBackground();
        
          drawGround();
        
          drawCoins();
        
          drawPowerups();
        
          drawGoal();
        
          drawPlayer();
        
          if (paused) {
        
            ctx.fillStyle = "rgba(0,0,0,0.35)";
        
            ctx.fillRect(
              0,
              0,
              W,
              H
            );
        
            ctx.fillStyle = "white";
        
            ctx.font =
              "bold 55px Arial";
        
            ctx.textAlign = "center";
        
            ctx.fillText(
              "PAUSED",
              W / 2,
              H / 2
            );
          }
        }
        
        function gameLoop() {
        
          update();
        
          draw();
        
          requestAnimationFrame(gameLoop);
        }
        
        startGame();
        
        gameLoop();
        
    </script>

</body>

</html>
