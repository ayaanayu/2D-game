<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galactic Defender</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a1d;font-family:Arial,sans-serif}
body{display:grid;place-items:center}
canvas{width:min(960px,100vw);height:min(720px,100vh);background:#050a1d;display:block}
</style>
</head>
<body>
<canvas id="game" width="960" height="720"></canvas>
<script>
"use strict";

const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const W=960,H=720,FPS=60;
const C={navy:"#050a1d",white:"#eef6ff",cyan:"#50e1ff",blue:"#3776ff",
pink:"#ff58b1",red:"#ff555c",orange:"#ffa540",yellow:"#ffe269",
green:"#59f59b",purple:"#ad68ff"};
let state="menu",score=0,highScore=0,level=1,shake=0,message="",messageTimer=0;
let bullets=[],enemies=[],powerups=[],explosions=[],boss=null,spawnTimer=0,enemiesSpawned=0,enemiesNeeded=0,levelClearTimer=0;
let stars=[],keys={},mouse={x:0,y:0};
for(let i=0;i<105;i++) stars.push({x:Math.random()*W,y:Math.random()*H,speed:18+Math.random()*97,r:[1,1,2,2,3][Math.floor(Math.random()*5)],b:120+Math.random()*136});

const buttons={
 play:{x:352,y:364,w:256,h:56,label:"PLAY"},
 instructions:{x:352,y:435,w:256,h:56,label:"INSTRUCTIONS"},
 back:{x:382,y:601,w:196,h:48,label:"BACK"},
 restart:{x:352,y:465,w:256,h:56,label:"RESTART GAME"},
 menu:{x:352,y:532,w:256,h:56,label:"MAIN MENU"}
};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function text(s,t,x,y,size=28,color=C.white,align="center"){s.font=`${size}px Arial`;s.fillStyle=color;s.textAlign=align;s.textBaseline="middle";s.fillText(t,x,y)}
function hit(r,x,y){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function button(b){
 const h=hit(b,mouse.x,mouse.y); ctx.fillStyle=h?"#174b8a":"#0e2a56";
 roundRect(b.x,b.y,b.w,b.h,12);ctx.fill();
 ctx.strokeStyle=h?C.cyan:C.blue;ctx.lineWidth=2;roundRect(b.x,b.y,b.w,b.h,12);ctx.stroke();
 text(ctx,b.label,b.x+b.w/2,b.y+b.h/2,28,C.white);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function reset(){
 score=0;level=1;bullets=[];enemies=[];powerups=[];explosions=[];boss=null;
 player=new Player(); highScore=Math.max(highScore,score);startLevel(1);
}
function startLevel(n){
 level=n;enemiesSpawned=0;enemiesNeeded={1:8,2:11,3:14,4:17}[n]||0;
 spawnTimer=1.1;levelClearTimer=0;
 message=n===5?"FINAL BOSS: THE VOID CRUISER":`LEVEL ${n}`;messageTimer=2.1;
 if(n===5)boss=new Boss();
}
function addScore(n){score+=n;highScore=Math.max(highScore,score)}
class Player{
 constructor(){this.x=W/2;this.y=H-78;this.speed=440;this.w=54;this.h=54;this.lives=3;this.fire=0;this.inv=0;this.rapid=0;this.triple=0;this.shield=0}
 update(dt){
  let d=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0);
  this.x=clamp(this.x+d*this.speed*dt,34,W-34);
  this.fire=Math.max(0,this.fire-dt);this.inv=Math.max(0,this.inv-dt);
  this.rapid=Math.max(0,this.rapid-dt);this.triple=Math.max(0,this.triple-dt);this.shield=Math.max(0,this.shield-dt);
 }
 shoot(){
  if(this.fire>0)return;
  this.fire=this.rapid>0?.105:.28;
  bullets.push(new Bullet(this.x,this.y-33,0,-680,true));
  if(this.triple>0){bullets.push(new Bullet(this.x-15,this.y-25,-155,-640,true));bullets.push(new Bullet(this.x+15,this.y-25,155,-640,true))}
 }
 hit(){
  if(this.inv>0||this.shield>0)return false;
  this.lives--;this.inv=1.35;explode(this.x,this.y,C.orange,true);shake=.28;
  if(this.lives<=0)state="gameover";return true;
 }
 draw(){
  if(this.inv>0&&Math.floor(this.inv*12)%2===0)return;
  let x=this.x,y=this.y,fl=10+Math.floor((performance.now()/65)%5);
  ctx.fillStyle=C.orange;ctx.beginPath();ctx.moveTo(x-11,y+21);ctx.lineTo(x,y+21+fl);ctx.lineTo(x+11,y+21);ctx.fill();
  ship([[x,y-30],[x-25,y+22],[x-10,y+17],[x,y+26],[x+10,y+17],[x+25,y+22]],C.blue,C.cyan,2);
  ctx.fillStyle="#aaf5ff";ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x-7,y+5);ctx.lineTo(x+7,y+5);ctx.fill();
  if(this.shield>0){ctx.strokeStyle=C.cyan;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,40,0,Math.PI*2);ctx.stroke()}
 }
}
class Bullet{
 constructor(x,y,vx,vy,player,damage=1){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.player=player;this.damage=damage;this.w=player?5:7;this.h=player?18:15}
 update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;return this.y>-40&&this.y<H+40&&this.x>-40&&this.x<W+40}
 draw(){ctx.fillStyle=this.player?"#2d82be":"#82225c";ctx.fillRect(this.x-this.w/2-3,this.y-this.h/2-2,this.w+6,this.h+4);ctx.fillStyle=this.player?C.cyan:C.pink;ctx.fillRect(this.x-this.w/2,this.y-this.h/2,this.w,this.h)}
 rect(){return {x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}}
}
const ENEMY={
 scout:{speed:92,health:1,w:38,h:33,color:C.pink},
 zigzag:{speed:118,health:1,w:42,h:35,color:C.purple},
 tank:{speed:67,health:3,w:54,h:42,color:C.orange}
};
class Enemy{
 constructor(kind,x,y){let s=ENEMY[kind];this.kind=kind;this.x=x;this.y=y;this.speed=s.speed+level*10;this.health=s.health;this.max=s.health;this.w=s.w;this.h=s.h;this.color=s.color;this.age=Math.random()*3}
 update(dt){this.age+=dt;this.y+=this.speed*dt;if(this.kind==="zigzag")this.x=clamp(this.x+Math.sin(this.age*4.5)*130*dt,26,W-26);else if(this.kind==="tank")this.x+=Math.sin(this.age*2.2)*38*dt}
 draw(){
  let x=this.x,y=this.y,p;
  if(this.kind==="scout")p=[[x-20,y-13],[x,y+18],[x+20,y-13],[x+12,y-5],[x-12,y-5]];
  else if(this.kind==="zigzag")p=[[x-21,y-13],[x-15,y+14],[x,y+5],[x+15,y+14],[x+21,y-13],[x,y-5]];
  else p=[[x-25,y-13],[x-16,y+19],[x+16,y+19],[x+25,y-13],[x,y-21]];
  ship(p,this.color,C.white,2);ctx.fillStyle=C.white;ctx.beginPath();ctx.arc(x,y-3,4,0,Math.PI*2);ctx.fill();
  if(this.max>1){ctx.fillStyle="#382337";ctx.fillRect(x-22,y-30,44,5);ctx.fillStyle=C.green;ctx.fillRect(x-22,y-30,44*this.health/this.max,5)}
 }
 rect(){return{x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}}
}
class Boss{
 constructor(){this.x=W/2;this.y=76;this.w=210;this.h=98;this.health=130;this.max=130;this.age=0;this.fire=1;this.entry=false}
 update(dt){
  this.age+=dt;if(!this.entry){this.y+=50*dt;if(this.y>=126){this.y=126;this.entry=true}}
  else this.x=W/2+Math.sin(this.age*.8)*285;
  this.fire-=dt;let shots=[];
  if(this.entry&&this.fire<=0){
   let phase=Math.floor(this.age/6)%3;
   if(phase===0){for(let a of[-.24,0,.24])shots.push(new Bullet(this.x,this.y+52,Math.sin(a)*155,Math.cos(a)*285,false));this.fire=.78}
   else if(phase===1){for(let a of[-.54,-.27,0,.27,.54])shots.push(new Bullet(this.x,this.y+50,Math.sin(a)*210,Math.cos(a)*245,false));this.fire=1.2}
   else{shots.push(new Bullet(this.x-67,this.y+42,-45,360,false),new Bullet(this.x+67,this.y+42,45,360,false));this.fire=.36}
  }bullets.push(...shots)
 }
 draw(){
  let x=this.x,y=this.y,p=[[x-104,y-20],[x-76,y+38],[x-29,y+22],[x,y+47],[x+29,y+22],[x+76,y+38],[x+104,y-20],[x+65,y-37],[x,y-48],[x-65,y-37]];
  ship(p,"#5f226f",C.pink,3);ctx.fillStyle="#23103f";ctx.beginPath();ctx.moveTo(x-34,y-27);ctx.lineTo(x,y-38);ctx.lineTo(x+34,y-27);ctx.lineTo(x+17,y+12);ctx.lineTo(x-17,y+12);ctx.fill();
  ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(x,y-12,9,0,Math.PI*2);ctx.fill();
  for(let o of[-72,72]){ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(x+o,y+12,7,0,Math.PI*2);ctx.fill()}
 }
 rect(){return{x:this.x-105,y:this.y-49,w:210,h:98}}
}
class Power{
 constructor(x,y){this.x=x;this.y=y;this.kind=["rapid","triple","shield","life"][Math.floor(Math.random()*4)];this.speed=145;this.r=15}
 update(dt){this.y+=this.speed*dt;return this.y<H+30}
 apply(){if(this.kind==="rapid")player.rapid=Math.max(player.rapid,8);else if(this.kind==="triple")player.triple=Math.max(player.triple,8);else if(this.kind==="shield")player.shield=Math.max(player.shield,7);else player.lives=Math.min(5,player.lives+1);message={rapid:"RAPID FIRE",triple:"TRIPLE SHOT",shield:"SHIELD",life:"EXTRA LIFE"}[this.kind];messageTimer=1.4}
 draw(){let m={rapid:"R",triple:"T",shield:"S",life:"+"}[this.kind],c={rapid:C.yellow,triple:C.purple,shield:C.cyan,life:C.green}[this.kind];ctx.fillStyle=c;ctx.beginPath();ctx.arc(this.x,this.y,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle=C.white;ctx.stroke();text(ctx,m,this.x,this.y,22,C.navy)}
 rect(){return{x:this.x-15,y:this.y-15,w:30,h:30}}
}
function ship(p,fill,outline,width){ctx.fillStyle=fill;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();ctx.strokeStyle=outline;ctx.lineWidth=width;ctx.stroke()}
function explode(x,y,color,large=false){let a=[];for(let i=0;i<(large?28:12);i++){let ang=Math.random()*Math.PI*2,sp=75+Math.random()*(large?215:105);a.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:.3+Math.random()*.42,color})}explosions.push(a)}
function updateExplosions(dt){explosions=explosions.filter(a=>{a.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.life-=dt});a.splice(0,a.length,...a.filter(p=>p.life>0));return a.length})}
function overlap(a,b){return a.x<a2(b).x+a2(b).w&&a.x+a.w>a2(b).x&&a.y<a2(b).y+a2(b).h&&a.y+a.h>a2(b).y}
function a2(b){return b.rect?b.rect():b}
function damageEnemy(e){e.health--;if(e.health<=0){let i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);explode(e.x,e.y,e.color);addScore(10);shake=Math.max(shake,.11);if(Math.random()<.18)powerups.push(new Power(e.x,e.y))}}
function update(dt){
 for(let s of stars){s.y+=s.speed*dt;if(s.y>H+s.r){s.y=-s.r;s.x=Math.random()*W}}
 messageTimer=Math.max(0,messageTimer-dt);shake=Math.max(0,shake-dt);player.update(dt);
 if(keys[" "]&&state==="playing")player.shoot();
 if(level<5&&enemiesSpawned<enemiesNeeded){spawnTimer-=dt;if(spawnTimer<=0){let choices=level===1?["scout"]:level===2?["scout","zigzag"]:level===3?["scout","zigzag","tank"]:["zigzag","tank","tank","scout"];let k=choices[Math.floor(Math.random()*choices.length)];enemies.push(new Enemy(k,44+Math.random()*(W-88),-35));enemiesSpawned++;spawnTimer=Math.max(.34,.94-level*.11)}}
 for(let e of enemies.slice()){e.update(dt);if(overlap(e,player)){enemies.splice(enemies.indexOf(e),1);explode(e.x,e.y,e.color);player.hit()}else if(e.y>H+35){enemies.splice(enemies.indexOf(e),1);player.hit()}}
 if(boss)boss.update(dt);
 bullets=bullets.filter(b=>b.update(dt));
 for(let b of bullets.slice()){
  if(b.player){
   let e=enemies.find(e=>overlap(b,e));
   if(e){bullets.splice(bullets.indexOf(b),1);damageEnemy(e);continue}
   if(boss&&overlap(b,boss)){bullets.splice(bullets.indexOf(b),1);boss.health--;if(boss.health<=0){explode(boss.x,boss.y,C.orange,true);addScore(250);shake=.65;boss=null;state="victory"}}
  }else if(overlap(b,player)){bullets.splice(bullets.indexOf(b),1);player.hit()}
 }
 for(let p of powerups.slice()){if(!p.update(dt))powerups.splice(powerups.indexOf(p),1);else if(overlap(p,player)){p.apply();powerups.splice(powerups.indexOf(p),1)}}
 updateExplosions(dt);
 if(level<5&&enemiesSpawned===enemiesNeeded&&enemies.length===0){levelClearTimer+=dt;if(levelClearTimer>=1.25)startLevel(level+1)}
}
function drawSpace(){ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);for(let i=0;i<4;i++){ctx.fillStyle=`rgb(${7+i*2},14,${45+i*5})`;ctx.beginPath();ctx.ellipse(-300+i*230,90+i*105,305,75,0,0,Math.PI*2);ctx.fill()}for(let s of stars){ctx.fillStyle=`rgb(${s.b/2},${s.b/2},${s.b})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}}
function drawHud(){text(ctx,`SCORE  ${String(score).padStart(5,"0")}`,118,30,28,C.white);text(ctx,`LEVEL  ${level}`,W/2,30,28,C.cyan);text(ctx,`LIVES  ${player.lives}`,W-100,30,28,C.white);let u=[];if(player.rapid>0)u.push(`Rapid ${player.rapid.toFixed(1)}s`);if(player.triple>0)u.push(`Triple ${player.triple.toFixed(1)}s`);if(player.shield>0)u.push(`Shield ${player.shield.toFixed(1)}s`);if(u.length)text(ctx,u.join("  •  "),W/2,H-22,22,C.yellow);if(boss){ctx.fillStyle="#3a1839";roundRect(W/2-220,59,440,17,7);ctx.fill();ctx.fillStyle=C.pink;roundRect(W/2-220,59,440*Math.max(0,boss.health)/boss.max,17,7);ctx.fill();ctx.strokeStyle=C.white;ctx.stroke();text(ctx,"VOID CRUISER",W/2,88,22,C.white)}}
function drawPlaying(){drawSpace();let ox=shake?Math.random()*10-5:0,oy=shake?Math.random()*8-4:0;ctx.save();ctx.translate(ox,oy);bullets.forEach(b=>b.draw());enemies.forEach(e=>e.draw());if(boss)boss.draw();powerups.forEach(p=>p.draw());player.draw();explosions.forEach(a=>a.forEach(p=>{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,5*p.life),0,Math.PI*2);ctx.fill()}));ctx.restore();drawHud();if(messageTimer>0)text(ctx,message,W/2,H/2-45,44,C.yellow)}
function drawMenu(){drawSpace();let preview=new Player();preview.x=W/2;preview.y=245;preview.draw();text(ctx,"Galactic Defender",W/2,126,78,C.cyan);text(ctx,"Defend the stars. Survive the Void Cruiser.",W/2,181,28,C.white);button(buttons.play);button(buttons.instructions);text(ctx,"A / D or arrow keys to move  •  Space to fire",W/2,552,22,"#a7c2eb");text(ctx,`HIGH SCORE  ${String(highScore).padStart(5,"0")}`,W/2,597,22,C.yellow)}
function drawInstructions(){drawSpace();text(ctx,"HOW TO PLAY",W/2,82,78,C.cyan);["Move: A / D or Left / Right Arrow Keys","Fire: Space","Destroy enemy ships for 10 points each.","Avoid enemy ships and their plasma bolts.","Collect R = Rapid Fire, T = Triple Shot, S = Shield, + = Extra Life.","Fight through four waves, then defeat the Void Cruiser in Level 5!"].forEach((s,i)=>text(ctx,s,W/2,190+i*57,28,C.white));text(ctx,"Press Enter or Esc to return",W/2,550,22,"#a7c2eb");button(buttons.back)}
function drawEnd(v){drawSpace();text(ctx,v?"GALAXY SAVED!":"GAME OVER",W/2,180,78,v?C.green:C.red);text(ctx,v?"The Void Cruiser has fallen.":"Your ship has been lost among the stars.",W/2,242,28,C.white);text(ctx,`FINAL SCORE  ${String(score).padStart(5,"0")}`,W/2,341,44,C.yellow);text(ctx,`HIGH SCORE  ${String(highScore).padStart(5,"0")}`,W/2,389,28,C.white);button(buttons.restart);button(buttons.menu);text(ctx,"Press Enter or R to restart",W/2,637,22,"#a7c2eb")}
function draw(){if(state==="menu")drawMenu();else if(state==="instructions")drawInstructions();else if(state==="playing")drawPlaying();else drawEnd(state==="victory")}
let player=new Player();
function loop(t){let dt=Math.min((t-(loop.last||t))/1000,.05);loop.last=t;if(state==="playing")update(dt);else for(let s of stars){s.y+=s.speed*dt;if(s.y>H+s.r){s.y=-s.r;s.x=Math.random()*W}}draw();requestAnimationFrame(loop)}
function mousePos(e){let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height}
canvas.addEventListener("mousemove",mousePos);
canvas.addEventListener("mousedown",e=>{mousePos(e);if(state==="menu"){if(hit(buttons.play,mouse.x,mouse.y)){reset();state="playing"}else if(hit(buttons.instructions,mouse.x,mouse.y))state="instructions"}else if(state==="instructions"){if(hit(buttons.back,mouse.x,mouse.y))state="menu"}else if(state==="gameover"||state==="victory"){if(hit(buttons.restart,mouse.x,mouse.y)){reset();state="playing"}else if(hit(buttons.menu,mouse.x,mouse.y))state="menu"}});
window.addEventListener("keydown",e=>{keys[e.key]=true;if([" ","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.key==="Escape"){state=state==="menu"?"menu":"menu"}else if(state==="menu"&&(e.key==="Enter"||e.key===" ")){reset();state="playing"}else if(state==="instructions"&&(e.key==="Enter"||e.key==="Escape"))state="menu";else if((state==="gameover"||state==="victory")&&(e.key==="Enter"||e.key.toLowerCase()==="r")){reset();state="playing"}});
window.addEventListener("keyup",e=>keys[e.key]=false);
requestAnimationFrame(loop);
</script>
</body>
</html>
